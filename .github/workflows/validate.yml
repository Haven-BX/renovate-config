name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Haven-BX org Actions policy is local_only (marketplace actions blocked).
# This workflow uses only run: steps — no uses: — so CI can run under that policy.
# Prefer SHA-pinned actions once the org allows selected/github-owned actions.

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth 1 origin "${GITHUB_SHA}"
          git checkout --force FETCH_HEAD

      - name: Install and validate
        run: |
          set -euo pipefail
          node --version
          npm --version
          npm ci --ignore-scripts
          npm run validate

  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth 1 origin "${GITHUB_SHA}"
          git checkout --force FETCH_HEAD

      - name: Install zizmor and audit workflows
        env:
          ZIZMOR_VERSION: "1.32.0"
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin
          zizmor --version
          zizmor .github/workflows
